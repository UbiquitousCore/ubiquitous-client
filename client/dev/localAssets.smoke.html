<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Local asset path — browser smoke test</title>
    <style>
      body {
        background: #14161a;
        color: #dfe3ea;
        font:
          13px/1.6 ui-monospace,
          monospace;
        padding: 1.5rem 2rem;
      }
      h1 {
        font:
          600 15px/1.4 ui-sans-serif,
          system-ui,
          sans-serif;
        margin: 0 0 1rem;
      }
      pre {
        white-space: pre-wrap;
        margin: 0;
      }
      body[data-result='pass'] h1::after {
        content: ' — PASS';
        color: #79d17d;
      }
      body[data-result='fail'] h1::after {
        content: ' — FAIL';
        color: #e8776f;
      }
    </style>
  </head>
  <body>
    <h1>Local asset path: .ipa &rarr; OPFS &rarr; decoded texture</h1>
    <pre id="out"></pre>
    <script type="module" src="./localAssets.smoke.ts"></script>
  </body>
</html>
