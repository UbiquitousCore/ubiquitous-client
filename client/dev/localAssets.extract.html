<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Extraction: what a real .ipa costs</title>
    <style>
      body {
        background: #14161a;
        color: #dfe3ea;
        font:
          13px/1.6 ui-monospace,
          monospace;
        padding: 1.5rem 2rem;
      }
      h1 {
        font:
          600 15px/1.4 ui-sans-serif,
          system-ui,
          sans-serif;
        margin: 0 0 1rem;
      }
      pre {
        white-space: pre-wrap;
        margin: 0 0 1.5rem;
      }
      #gallery {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: flex-start;
      }
      figure {
        margin: 0;
      }
      figure canvas {
        max-width: 220px;
        max-height: 220px;
        display: block;
        border: 1px solid #2b303a;
        border-radius: 4px;
        background: repeating-conic-gradient(#22262d 0 25%, #191c22 0 50%) 0 0/16px 16px;
      }
      figcaption {
        color: #8b93a1;
        font-size: 11px;
        margin-top: 0.35rem;
      }
      body[data-result='pass'] h1::after {
        content: ' — PASS';
        color: #79d17d;
      }
      body[data-result='fail'] h1::after {
        content: ' — FAIL';
        color: #e8776f;
      }
    </style>
  </head>
  <body>
    <h1>Mounting a real .ipa: what gets extracted, and can a second visit skip it</h1>
    <pre id="out"></pre>
    <div id="gallery"></div>
    <script type="module" src="./localAssets.extract.ts"></script>
  </body>
</html>
